<g transform="translate(706 132)">
 <text class="heading">1   Gate and avenue</text><text class="sub" y="25">Spawn just outside the gate at (0, −4).</text>
 <text class="heading" y="86">2   Fountain court</text><text class="sub" y="111">Turn right before the basin at (0, 47).</text>
 <text class="heading" y="172">3   Academy frontage</text><text class="sub" y="197">The clock tower anchors the approach.</text>
 <text class="heading" y="258">4   East training path</text><text class="sub" y="283">Follow the wing to the opening in the rail.</text>
 <text class="heading" y="344">5   Training oval</text><text class="sub" y="369">Enter at (40, 99). Turn east to run the bend.</text>
