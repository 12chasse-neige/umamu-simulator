<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 742" role="img" aria-labelledby="title desc">
<title id="title">Tracen Academy · first playable layout</title>
<desc id="desc">Metric prototype plan. From the front gate follow the avenue toward the tower, turn right before the fountain, and follow the east wing to the near straight of the training oval.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#223c38}.title{font-size:29px;font-weight:bold}.sub{font-size:15px}.heading{font-size:19px;font-weight:bold}.small{font-size:14px}.pin{fill:white;font-weight:bold;font-size:15px;text-anchor:middle}.number{fill:#304d46;stroke:white;stroke-width:2}
</style>
